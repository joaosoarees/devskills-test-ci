version: 0.2

env:
  variables:
    HUSKY: '0' # Husky 9 skips installing Git hooks; nobody commits in a build

phases:
  install:
    runtime-versions:
      nodejs: 24 # read on EC2 images; Lambda compute ignores it and uses the image's Node
    commands:
      # Not corepack: on Lambda compute its symlink fails (read-only file system).
      - npm install --global pnpm@12.11.2 # the version in package.json's packageManager
  pre_build:
    on-failure: ABORT
    commands:
      - test -n "${VITE_API_URL:-}" || { echo "VITE_API_URL is not set" >&2; false; }
      - test -n "${STAGE:-}" || { echo "STAGE is not set" >&2; false; }
      - pnpm install --frozen-lockfile
  build:
    on-failure: ABORT # a failed build ends here: post_build never starts
    commands:
      - pnpm build --mode "$STAGE"
  post_build:
    commands:
      # Second lock: publish only if every earlier phase succeeded.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      # The cloudfront-cache-invalidation skill's script: builds, uploads in order, invalidates, waits.
      - scripts/deploy.sh "$STAGE"
